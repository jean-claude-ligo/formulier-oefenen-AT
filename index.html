<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulier invullen in 8 stappen – Ligo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blauw: #056181;
    --turkoois: #09b9bb;
    --ijsblauw: #e3f5f5;
    --geel: #e9b950;
    --geel-licht: #fbf3df;
    --mint: #82ccb1;
    --mint-licht: #eaf7f2;
    --zalm: #f6d2c0;
    --oranje: #e06025;
    --rood: #c4321a;
    --groen: #1f7a5a;
    --grijs: #575656;
    --ink: #1f2a30;
    --paper: #ffffff;
    --line: #c9e3e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ijsblauw); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
    font-size: 20px; line-height: 1.45;
  }
  header.kopbalk { background: var(--paper); border-bottom: 4px solid var(--turkoois); }
  header.kopbalk .binnen { max-width: 760px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
  header.kopbalk img { height: 44px; width: auto; display: block; }
  header.kopbalk span { color: var(--grijs); font-size: .95rem; border-left: 2px solid var(--line); padding-left: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 16px; color: var(--blauw); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2 { font-size: 1.3rem; margin: 0 0 12px; color: var(--blauw); }
  a { color: var(--blauw); }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
  .hidden { display: none !important; }

  /* ---------- Startscherm: 8 tegels ---------- */
  .tegels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .tegel {
    position: relative; aspect-ratio: 1 / 1; border: 3px solid var(--blauw); border-radius: 10px; background: var(--paper);
    color: var(--blauw); font: inherit; font-size: 3.2rem; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px;
  }
  .tegel:hover { background: var(--ijsblauw); }
  .tegel:focus-visible { outline: 4px solid var(--turkoois); outline-offset: 3px; }
  .tegel .kenmerken { display: flex; gap: 4px; height: 26px; }
  .tegel .kenmerken img { height: 26px; width: 26px; opacity: .85; }
  .tegel .kenmerken .k { font-size: 1rem; line-height: 26px; color: var(--grijs); }
  .tegel.klaar { background: var(--mint-licht); border-color: var(--groen); color: var(--groen); }
  .tegel .badge {
    position: absolute; top: -12px; right: -12px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--groen); color: #fff; display: none; align-items: center; justify-content: center; border: 3px solid #fff;
  }
  .tegel.klaar .badge { display: flex; }
  details.lesgever { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; font-size: 1rem; }
  details.lesgever summary { cursor: pointer; font-weight: 700; color: var(--blauw); }
  details.lesgever ol { padding-left: 1.3em; margin: 12px 0; }
  details.lesgever li { margin-bottom: 6px; }
  details.lesgever p { margin: 8px 0; }

  /* ---------- Bovenbalk in een oefening ---------- */
  .oefbalk { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .oefnummer { font-size: 1.6rem; font-weight: 700; color: var(--blauw); display: flex; align-items: center; gap: 10px; }
  .oefnummer .cijfer {
    width: 52px; height: 52px; border-radius: 50%; background: var(--blauw); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 1.7rem;
  }
  .stippen { display: flex; gap: 6px; margin-left: auto; }
  .stippen span { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .stippen span.nu { background: var(--blauw); }
  .stippen span.klaar { background: var(--mint); }

  button { font: inherit; cursor: pointer; }
  .knop {
    font-weight: 700; padding: 12px 24px; border: 2px solid var(--blauw); border-radius: 6px;
    background: var(--blauw); color: #fff; display: inline-flex; align-items: center; gap: 10px; min-height: 56px;
  }
  .knop:hover { background: #044e68; border-color: #044e68; }
  .knop.wit { background: #fff; color: var(--blauw); }
  .knop.wit:hover { background: var(--ijsblauw); }
  .knop:focus-visible, .rond:focus-visible, .pijl:focus-visible { outline: 4px solid var(--turkoois); outline-offset: 2px; }
  .knop svg { width: 26px; height: 26px; flex-shrink: 0; }
  .rond {
    width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--blauw); background: #fff; color: var(--blauw);
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .rond:hover { background: var(--ijsblauw); }
  .rond svg { width: 30px; height: 30px; }

  /* ---------- Velden ---------- */
  .uitleg-ster { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 1.05rem; }
  .uitleg-ster .ster { font-size: 1.8rem; line-height: 1; }
  .ster { color: var(--rood); font-weight: 700; margin-left: 3px; }
  .veld { margin-top: 22px; }
  .veld:first-child { margin-top: 0; }
  .vraag { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .vraag label, .vraag .vraagtekst { font-weight: 700; font-size: 1.15rem; }
  .picto { width: 64px; height: 64px; object-fit: contain; flex-shrink: 0; border-radius: 4px; background: #fff; }
  input[type=text], select {
    width: 100%; font: inherit; font-size: 1.2rem; padding: 12px 14px; border: 2px solid #8fbfc4;
    border-radius: 6px; background: #fff; color: var(--ink); min-height: 56px;
  }
  select { cursor: pointer; }
  input:focus, select:focus { outline: none; border-color: var(--blauw); box-shadow: 0 0 0 4px rgba(5,97,129,.2); }
  input::placeholder { color: #8a9499; }
  .kort input[type=text] { max-width: 180px; }

  /* Oefening 1: invulveld naast de vraag (zoals de tabel op papier) */
  .tabel { border: 2px solid var(--ink); border-radius: 4px; }
  .veld.naast { display: grid; grid-template-columns: 260px 1fr; margin: 0; border-top: 2px solid var(--ink); }
  .veld.naast:first-child { border-top: 0; }
  .veld.naast .vraag { margin: 0; padding: 10px 12px; border-right: 2px solid var(--ink); flex-direction: column; align-items: flex-start; gap: 6px; }
  .veld.naast .invul { padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; }

  /* Groep adres */
  fieldset.groep { border: 2px solid var(--line); border-radius: 8px; margin: 22px 0 0; padding: 6px 16px 18px; }
  fieldset.groep legend { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; color: var(--blauw); padding: 0 8px; }
  .groepveld { display: grid; grid-template-columns: 3fr 1.3fr; gap: 0 16px; align-items: end; }
  .groepveld.pc { grid-template-columns: 1.3fr 3fr; }
  .groepveld.drie { grid-template-columns: 3fr 1.2fr 1fr; }
  .groepveld .veld, fieldset.groep > .veld { margin-top: 18px; }

  /* Samengestelde velden */
  .datum3 { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .datum3 label { display: block; font-size: .9rem; color: var(--grijs); }
  .datum3 input, .datum3 select { width: 110px; }
  .datum3 .jaar input, .datum3 .jaar select { width: 140px; }
  .telprefix { display: flex; align-items: stretch; }
  .telprefix span { display: flex; align-items: center; padding: 0 14px; background: var(--ijsblauw); border: 2px solid #8fbfc4; border-right: 0; border-radius: 6px 0 0 6px; font-weight: 700; }
  .telprefix input { border-radius: 0 6px 6px 0; }
  .keuzes { display: flex; gap: 12px; flex-wrap: wrap; }
  .keuzes label, .vink label {
    display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border: 2px solid #8fbfc4; border-radius: 6px;
    cursor: pointer; font-weight: 400; min-height: 56px; background: #fff;
  }
  .keuzes input, .vink input { width: 26px; height: 26px; margin: 0; accent-color: var(--blauw); cursor: pointer; }

  /* Hulpknop (oefening 5 en 6) */
  .hulp { position: relative; display: inline-flex; }
  .hulpknop {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--blauw); background: var(--ijsblauw); color: var(--blauw);
    font-weight: 700; font-size: 1.3rem; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  }
  .hulp .popup {
    display: none; position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); z-index: 5;
    background: #fff; border: 3px solid var(--blauw); border-radius: 10px; padding: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .hulp .popup img { width: 110px; height: 110px; display: block; object-fit: contain; }
  .hulp:hover .popup, .hulp.toon .popup { display: block; }

  /* Voorleesknop */
  .spreek {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--blauw); padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .spreek:hover { background: var(--ijsblauw); }
  .spreek svg { width: 26px; height: 26px; }

  /* Foutmarkering bij verbeteren */
  .veld.fout input[type=text], .veld.fout select, .veld.fout .keuzes label, .veld.fout .vink label { border-color: var(--rood); background: #fff8f5; }
  .veld.fout .telprefix span { border-color: var(--rood); }
  .veld.teveel input[type=text], .veld.teveel select { border-color: var(--geel); background: var(--geel-licht); }
  .melding { display: none; align-items: center; gap: 8px; margin-top: 6px; font-weight: 700; color: var(--rood); }
  .veld.teveel .melding { color: #8a5a00; }
  .veld.fout .melding, .veld.teveel .melding { display: flex; }
  .melding svg { width: 26px; height: 26px; flex-shrink: 0; }

  .knoppen { display: flex; gap: 14px; margin-top: 28px; align-items: center; flex-wrap: wrap; }
  .pijl {
    width: 84px; height: 64px; border-radius: 10px; border: 2px solid var(--blauw); background: var(--blauw); color: #fff; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pijl.terug { background: #fff; color: var(--blauw); }
  .pijl svg { width: 40px; height: 40px; }
  .pijl:hover { filter: brightness(.92); }
  .stapteller { color: var(--grijs); font-size: 1rem; margin: 0 0 14px; }
  .bladstippen { display: flex; gap: 10px; margin: 0 0 20px; }
  .bladstippen span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--blauw); }
  .bladstippen span.gedaan { background: var(--blauw); }
  .bladstippen span.nu { background: var(--turkoois); border-color: var(--turkoois); }

  /* ---------- Feedback ---------- */
  .uitslag { text-align: center; padding: 8px 0 18px; }
  .uitslag .groot { width: 120px; height: 120px; margin: 0 auto 10px; display: block; }
  .uitslag h2 { font-size: 2rem; justify-content: center; display: flex; align-items: center; gap: 8px; margin: 0; }
  .uitslag.goed h2 { color: var(--groen); }
  .uitslag.niet h2 { color: var(--rood); }
  ul.lijst { list-style: none; margin: 0; padding: 0; }
  ul.lijst li { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 8px 4px; border-top: 1px solid var(--line); }
  ul.lijst li img.picto, ul.lijst li .leegpicto { width: 52px; height: 52px; }
  ul.lijst li .naam { font-weight: 700; }
  ul.lijst li .uitleg { display: block; font-weight: 700; font-size: 1rem; }
  ul.lijst li.ok .uitleg { color: var(--groen); font-weight: 400; }
  ul.lijst li.fout .uitleg, ul.lijst li.leeg .uitleg { color: var(--rood); }
  ul.lijst li.teveel .uitleg { color: #8a5a00; }
  ul.lijst li svg.st { width: 40px; height: 40px; }
  ul.lijst li.fout, ul.lijst li.leeg { background: #fff8f5; }
  ul.lijst li.teveel { background: var(--geel-licht); }

  @media (max-width: 640px) {
    body { font-size: 18px; }
    header.kopbalk .binnen > span { display: none; }
    .tegels { grid-template-columns: repeat(2, 1fr); }
    .veld.naast { grid-template-columns: 1fr; }
    .veld.naast .vraag { border-right: 0; flex-direction: row; align-items: center; padding-bottom: 0; }
    .groepveld, .groepveld.pc, .groepveld.drie { grid-template-columns: 1fr; }
    .panel { padding: 18px 14px; }
    .picto { width: 52px; height: 52px; }
    .stippen { margin-left: 0; width: 100%; }
  }
  /* ---------- Klas (live volgen) ---------- */
  .klasbalk { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin: -6px 0 14px; }
  .klasbalk .knop svg, .klasicoon svg { width: 30px; height: 30px; }
  .klasicoon { display: inline-flex; }
  .klaschip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 30px; background: var(--paper); border: 2px solid var(--blauw); font-weight: 700; color: var(--blauw); }
  .klaschip svg { width: 24px; height: 24px; }
  .klaschip .dier { font-size: 1.8rem; line-height: 1; }
  .rond.klein { width: 40px; height: 40px; font-size: 1.1rem; }
  .coderij { display: flex; gap: 12px; align-items: stretch; }
  input.code { max-width: 220px; font-size: 2rem !important; letter-spacing: .25em; text-transform: uppercase; text-align: center; font-weight: 700; }
  .dieren { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .dierknop { font-size: 2.8rem; aspect-ratio: 1 / 1; border: 3px solid var(--line); border-radius: 12px; background: #fff; padding: 0; }
  .dierknop:hover:not(:disabled) { border-color: var(--blauw); background: var(--ijsblauw); }
  .dierknop:focus-visible { outline: 4px solid var(--turkoois); outline-offset: 2px; }
  .dierknop:disabled { opacity: .18; cursor: not-allowed; }
  .lesgeverpanel { font-size: 1rem; }
  .lesgeverpanel .bestaande { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .lesgeverpanel .bestaande label { display: block; margin-bottom: 8px; }
  .lesgeverpanel .melding { color: var(--rood); }
  .klein { font-size: .9rem; color: var(--grijs); }
  .grotecode { margin-left: auto; display: flex; align-items: baseline; gap: 12px; color: var(--blauw); }
  .grotecode span { font-size: 1rem; color: var(--grijs); }
  .grotecode strong { font-size: 2.6rem; letter-spacing: .15em; }
  .tabelwrap { overflow-x: auto; }
  table.klas { border-collapse: collapse; width: 100%; min-width: 520px; }
  table.klas th, table.klas td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: center; }
  table.klas thead th { color: var(--blauw); font-size: 1.1rem; }
  table.klas tbody th { text-align: left; font-weight: 700; white-space: nowrap; }
  table.klas .dier { font-size: 1.6rem; vertical-align: middle; }
  table.klas td { font-size: 1.3rem; font-weight: 700; width: 9%; }
  table.klas td small { display: block; font-size: .75rem; font-weight: 400; color: var(--grijs); }
  table.klas td.actief { box-shadow: inset 0 0 0 3px var(--blauw); border-radius: 6px; }
  table.klas tr.weg { opacity: .45; }
  .c-klaar { color: var(--groen); } .c-fout { color: var(--rood); } .c-bezig { color: var(--turkoois); }
  td.c-klaar { background: var(--mint-licht); } td.c-fout { background: #fff1ec; }
  .legende { font-size: .9rem; color: var(--grijs); display: flex; gap: 6px 10px; flex-wrap: wrap; }
  .leegklas { font-size: 1.1rem; }
  .knop.gevaar { border-color: var(--rood); color: var(--rood); }
  @media (max-width: 640px) { .dieren { grid-template-columns: repeat(4, 1fr); } .grotecode strong { font-size: 2rem; } }
</style>
</head>

};
const kies = a => a[Math.floor(Math.random() * a.length)];
const schud = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const metLabel = (key, extra) => veld(key, Object.assign({ label: kies(V[key]) }, extra || {}));

function variabelAdres(metBus) {
  const t = { titel: kies(V.adresTitel) };
  const r = Math.random();
  if (metBus && r < 0.33) return groep([metLabel('straat'), metLabel('huisnummer'), veld('bus'), veld('postcode'), metLabel('stad')], Object.assign(t, { metBus: true }));
  if (r < 0.66) return groep([metLabel('straatnr'), veld('postcode'), metLabel('stad')], Object.assign(t, { samen: true }));
  return groep([metLabel('straat'), metLabel('huisnummer'), veld('postcode'), metLabel('stad')], t);
}

// Willekeurig verplicht maken: namen altijd, de rest willekeurig. Minstens 2 verplicht en 2 niet.
function zetSterren(items) {
  const vrij = items.filter(it => !['voornaam', 'familienaam', 'akkoord'].includes(it.key));
  let k;
  do { k = vrij.map(() => Math.random() < 0.5); } while (k.filter(Boolean).length < 2 || k.filter(x => !x).length < 2);
  items.forEach(it => {
    const req = vrij.includes(it) ? k[vrij.indexOf(it)] : true;
    if (it.groep) it.velden.forEach(v => v.req = v.key === 'bus' ? false : req);
    else it.req = req;
  });
}

function maakOefening(n) {
  const basis = () => ['voornaam', 'familienaam', 'adres', 'telefoon', 'nationaliteit', 'geboortedatum', 'email'].map(k => veld(k));
  const gesplitst = () => [veld('voornaam'), veld('familienaam'), adresGroep(), veld('telefoon'), veld('nationaliteit'), veld('geboortedatum'), veld('email')];
  const c = { n, layout: 'onder', picto: 'zien', spreek: true, alles: true, knopIcoon: true, blad: 'een' };
  switch (n) {
    case 1: return Object.assign(c, { layout: 'naast', bladen: [basis()], knop: 'Verzenden' });
    case 2: return Object.assign(c, { bladen: [basis()], knop: 'Versturen' });
    case 3: return Object.assign(c, { bladen: [gesplitst()], knop: 'Indienen' });
    case 4: return Object.assign(c, { blad: 'pijl', knop: 'Bevestigen', bladen: [
      [veld('voornaam'), veld('familienaam')], [adresGroep()], [veld('telefoon'), veld('email')], [veld('nationaliteit'), veld('geboortedatum')]] });
    case 5: return Object.assign(c, { picto: 'hulp', bladen: [gesplitst()], knop: 'Verzenden' });
    case 6: {
      const items = gesplitst();
      const ster = { voornaam: 1, familienaam: 1, telefoon: 1, geboortedatum: 1 };
      items.forEach(it => { if (it.groep) it.velden.forEach(v => v.req = true); else it.req = !!ster[it.key]; });
      return Object.assign(c, { picto: 'hulp', alles: false, bladen: [items], knop: 'Indienen' });
    }
    case 7: {
      const items = [metLabel('voornaam'), metLabel('familienaam'), metLabel('geslacht'), variabelAdres(false),
        metLabel('telefoon'), metLabel('email'), metLabel('nationaliteit'), metLabel('geboortedatum'), metLabel('moedertaal')];
      zetSterren(items);
      return Object.assign(c, { picto: 'geen', spreek: false, alles: false, knopIcoon: false, bladen: [items], knop: kies(V.verzend) });
    }
    case 8: {
      const namen = [metLabel('voornaam'), metLabel('familienaam')];
      if (Math.random() < 0.6) namen.push(metLabel('geslacht'));
      const datumSoort = kies(['tekst', 'datum3', 'datumKies']);
      const datum = metLabel('geboortedatum', datumSoort === 'tekst' ? {} : { soort: datumSoort });
      const tel = metLabel('telefoon', Math.random() < 0.5 ? { soort: 'telPrefix', check: 'telLokaal' } : {});
      const nat = metLabel('nationaliteit', Math.random() < 0.5 ? { soort: 'kies', opties: LANDEN, check: 'vrij' } : {});
      const eenheden = schud([[variabelAdres(true)], [tel, metLabel('email')], schud([nat, datum]), [metLabel('moedertaal')]]);
      const alle = [namen, ...eenheden];
      zetSterren(alle.flat());
      // verdeel over 3 of 4 bladen
      const aantal = Math.random() < 0.5 ? 3 : 4;
      const bladen = Array.from({ length: aantal }, () => []);
      bladen[0].push(...namen);
      eenheden.forEach((e, i) => bladen[1 + Math.floor(i * (aantal - 1) / eenheden.length)].push(...e));
      bladen[aantal - 1].push(veld('akkoord', { req: true }));
      return Object.assign(c, { picto: 'geen', spreek: false, alles: false, knopIcoon: false, blad: 'knop',
        volgende: kies(V.volgende), bladen, knop: kies(V.verzend) });
    }
  }
}

// ---------- Controle ----------
const LETTERS = /^[\p{L}][\p{L}\p{M}\s'’.\-]*$/u;
function controle(it, v) {
  switch (it.check) {
    case 'naam':
      if (/\d/.test(v)) return 'Geen cijfers';
      if (v.length < 2 || !LETTERS.test(v)) return 'Alleen letters';
      return null;
    case 'adres':
      if (!/\p{L}{2,}/u.test(v)) return 'De straat ontbreekt';
      if (!/\d/.test(v)) return 'Het nummer ontbreekt';
      return null;
    case 'straat':
      if (/\d/.test(v)) return 'Het nummer niet hier';
      if (!/\p{L}{2,}/u.test(v)) return 'De naam van de straat';
      return null;
    case 'huisnr':
      if (!/^\d/.test(v)) return 'Begin met een cijfer';
      if (!/^\d{1,4}\s*[a-z]?\s*((bus|b\.?|\/|-)?\s*[a-z0-9]{1,5})?$/i.test(v)) return 'Alleen het nummer';
      return null;
    case 'postcode':
      return /^\d{4}$/.test(v) ? null : '4 cijfers. Zo: 8800';
    case 'stad':
      if (/\d/.test(v)) return 'Geen cijfers';
      return LETTERS.test(v) && v.length > 1 ? null : 'Alleen letters';
    case 'tel': {
      const d = v.replace(/[\s.\/\-()]/g, '');
      if (!/^\+?\d+$/.test(d)) return 'Alleen cijfers';
      if (d[0] === '+') return d.length >= 11 && d.length <= 14 ? null : 'Kijk het nummer na';
      if (d[0] !== '0') return 'Begin met 0';
      if (d.length < 9) return 'Te kort';
      if (d.length > 10) return 'Te lang';
      return null;
    }
    case 'telLokaal': {
      const d = v.replace(/[\s.\/\-()]/g, '');
      if (!/^\d+$/.test(d)) return 'Alleen cijfers';
      const min = d[0] === '0' ? 9 : 8, max = d[0] === '0' ? 10 : 9;
      if (d.length < min) return 'Te kort';
      if (d.length > max) return 'Te lang';
      return null;
    }
    case 'email':
      if (!v.includes('@')) return 'De @ ontbreekt';
      if (/\s/.test(v)) return 'Geen spaties';
      return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v) ? null : 'Zo: naam@gmail.com';
    case 'datum': {
      const m = v.match(/^(\d{1,2})\s*[\/\-. ]\s*(\d{1,2})\s*[\/\-. ]\s*(\d{4})$/);
      if (!m) return 'Zo: 31/01/1990';
      const d = +m[1], mo = +m[2], j = +m[3], dt = new Date(j, mo - 1, d);
      if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return 'Deze datum bestaat niet';
      if (j < 1900 || j > new Date().getFullYear() - 5) return 'Kijk het jaar na';
      return null;
    }
    default: return null;
  }
}

// waarde lezen uit het geheugen (state.waarden), nooit bewaard
function waardeVan(it) {
  const W = state.waarden;
  if (it.soort === 'datum3' || it.soort === 'datumKies') {
    const d = (W[it.key + '_d'] || '').trim(), m = (W[it.key + '_m'] || '').trim(), j = (W[it.key + '_j'] || '').trim();
    if (!d && !m && !j) return '';
    if (!d || !m || !j) return { half: true };
    return d + '/' + m + '/' + j;
  }
  if (it.soort === 'vink') return W[it.key] ? 'ja' : '';
  return (W[it.key] || '').trim();
}

function beoordeel(it) {
  const nodig = state.cfg.alles || it.req;
  const v = waardeVan(it);
  const ingevuld = v !== '';
  if (nodig && !ingevuld) return { st: 'leeg', tekst: it.soort === 'vink' ? 'Aanvinken' : 'Vergeten' };
  if (!nodig && ingevuld) return { st: 'teveel', tekst: 'Niet nodig: geen *' };
  if (!nodig) return { st: 'ok', tekst: 'Goed: leeg gelaten' };
  if (v.half) return { st: 'fout', tekst: 'Dag, maand en jaar' };
  const f = controle(it, v);
  return f ? { st: 'fout', tekst: f } : { st: 'ok', tekst: '' };
}

function zetSS(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

async function klasGet(params) { const r = await fetch(KLAS_URL + '?' + new URLSearchParams(params)); return r.json(); }

  const r = await fetch(KLAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });

}

    <div class="oefbalk"><button type="button" class="rond" data-actie="start" aria-label="Terug">${IC.huis}</button>
      <div class="grotecode"><span>Klascode</span> <strong>${esc(lesgeverCode)}</strong></div></div>
    <div class="panel lesgeverpanel">
      <div id="klastabel"><p>Laden…</p></div>
      <p class="klein" id="bijgewerkt"></p>
      <div class="knoppen">
        <button type="button" class="knop wit" data-actie="andereklas">Andere klas</button>
        <button type="button" class="knop wit gevaar" data-actie="wisklas">Klas wissen</button>
      </div>
      <p class="klein">Alleen per dier: welke oefening bezig ●, fout ✘ of klaar ✔ is, met het aantal pogingen. Nooit wat cursisten invullen. Alles verdwijnt 6 uur na de laatste activiteit, of meteen met "Klas wissen".</p>
    </div>`;
  laadKlas();
  pollTimer = setInterval(laadKlas, 5000);
}

async function laadKlas() {
  const doel = document.getElementById('klastabel');
  if (!doel) return stopPoll();
  try {
    const r = await klasGet({ actie: 'klas', code: lesgeverCode });
    if (!document.getElementById('klastabel')) return;
    if (r.fout) { lesgeverCode = null; zetSS(LK, null); return toonLesgever('Deze klas bestaat niet (meer).'); }
    const nu = r.nu || Date.now();
    const rijen = Object.entries(r.cursisten);
    const cel = (o, actief) => {
      if (!o) return '<td></td>';
      const p = o.p > 1 ? `<small>${o.p}×</small>` : '';
      if (o.s === 'klaar') return `<td class="c-klaar" title="klaar">✔${p}</td>`;
      if (o.s === 'fout') return `<td class="c-fout ${actief ? 'actief' : ''}" title="fout">✘${o.p > 1 ? `<small>${o.p}×</small>` : ''}</td>`;
      return `<td class="c-bezig ${actief ? 'actief' : ''}" title="bezig">●</td>`;
    };
    doel.innerHTML = rijen.length === 0
      ? `<p class="leegklas">Nog niemand. Cursisten tikken op <strong>Klas</strong> en typen <strong>${esc(lesgeverCode)}</strong>.</p>`
      : `<div class="tabelwrap"><table class="klas">
          <thead><tr><th>Cursist</th>${[1,2,3,4,5,6,7,8].map(n => `<th>${n}</th>`).join('')}</tr></thead>
          <tbody>${rijen.map(([dier, c]) => {
            const weg = nu - c.t > 15 * 60 * 1000;
            return `<tr class="${weg ? 'weg' : ''}"><th scope="row"><span class="dier">${DIER[dier] || ''}</span> ${esc(dier)}</th>${[1,2,3,4,5,6,7,8].map(n => cel(c.o[n], c.nu === n)).join('')}</tr>`;
          }).join('')}</tbody></table></div>
          <p class="legende"><span class="c-bezig">●</span> bezig <span class="c-fout">✘</span> nog fouten <span class="c-klaar">✔</span> klaar · <span style="opacity:.5">grijs</span> = 15 min niets gedaan</p>`;
    document.getElementById('bijgewerkt').textContent = 'Bijgewerkt om ' + new Date().toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' · ververst elke 5 seconden';
  } catch (e) {
    const b = document.getElementById('bijgewerkt'); if (b) b.textContent = 'Geen verbinding. Ik probeer het opnieuw…';
  }
}

async function klasActie(actie, knop) {
  if (actie === 'klas') { klasCodeTmp = null; toonKlasCode(); return true; }
  if (actie === 'klasweg') { mijnKlas = null; zetSS(KK, null); toonStart(); return true; }
  if (actie === 'lesgever') { location.hash = 'lesgever'; toonLesgever(); return true; }
  if (actie === 'nieuweklas') {
    try { const r = await klasGet({ actie: 'nieuw' }); if (r.code) { lesgeverCode = r.code; zetSS(LK, r.code); } toonLesgever(r.code ? '' : 'Lukt niet. Probeer opnieuw.'); }
    catch (e) { toonLesgever('Geen verbinding met het script.'); }
    return true;
  }
  if (actie === 'andereklas') { lesgeverCode = null; zetSS(LK, null); toonLesgever(); return true; }
  if (actie === 'wisklas') {
    if (!wisBevestig) { wisBevestig = true; knop.textContent = 'Zeker? Klik nog eens'; setTimeout(() => { wisBevestig = false; if (knop.isConnected) knop.textContent = 'Klas wissen'; }, 4000); return true; }
    try { await klasPost({ actie: 'wis', code: lesgeverCode }); } catch (e) {}
    lesgeverCode = null; zetSS(LK, null); toonLesgever(); return true;
  }
  return false;
}

let state = null;
const VK = 'ligo-formulier-bt2-klaar';
function klaarLijst() { try { return JSON.parse(sessionStorage.getItem(VK)) || {}; } catch (e) { return {}; } }
function zetKlaar(n) { const k = klaarLijst(); k[n] = 1; try { sessionStorage.setItem(VK, JSON.stringify(k)); } catch (e) {} }

const main = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function spreekKnop(tekst) {
  if (!('speechSynthesis' in window)) return '';
  return `<button type="button" class="spreek" data-spreek="${esc(tekst)}" aria-label="Lees voor: ${esc(tekst)}">${IC.spreek}</button>`;
}
function spreek(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/\*/g, '').replace(/^Tel\.$/, 'telefoon').replace(/^Nr\.$/, 'nummer'));
    u.lang = 'nl-BE'; u.rate = 0.85;
    const stem = speechSynthesis.getVoices().find(v => v.lang === 'nl-BE') || speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('nl'));
    if (stem) u.voice = stem;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- Startscherm ----------
function toonStart() {
  state = null; stopPoll();
  if (location.hash === '#lesgever') history.replaceState(null, '', location.pathname + location.search);
  const klaar = klaarLijst();
  const kenmerkIcoon = { picto: `<img src="${P.persoon}" alt="">`, hulp: '<span class="k" style="font-weight:700">?</span>',
    ster: '<span class="k" style="color:var(--rood);font-weight:700;font-size:1.4rem">*</span>', pijl: `<span class="k" style="width:24px">${IC.rechts}</span>` };
  main.innerHTML = `
    ${klasbalkHtml()}
    <h1>Een formulier invullen ${spreekKnop('Een formulier invullen. Kies een oefening.')}</h1>
    <div class="tegels">
      ${[1,2,3,4,5,6,7,8].map(n => `
        <button class="tegel ${klaar[n] ? 'klaar' : ''}" data-oef="${n}" aria-label="Oefening ${n}${klaar[n] ? ', klaar' : ''}">
          <span class="badge">${IC.vink}</span>
          ${n}
          <span class="kenmerken">${OEF[n].kenmerk.map(k => kenmerkIcoon[k]).join('')}</span>
        </button>`).join('')}
    </div>
    <details class="lesgever">
      <summary>Voor de lesgever</summary>
      <p>De cursist vult telkens zijn eigen personalia in. Na het versturen ziet hij per vraag een groen vinkje of een rood kruis met een korte uitleg. Een groen vinkje op de tegel betekent: die oefening is één keer helemaal juist gelukt.</p>
      <ol>
        <li>Invulvak naast de vraag, met pictogram. Alles op één blad.</li>
        <li>Invulvak onder de vraag, met pictogram.</li>
        <li>Adres in stukken: straat, huisnummer, postcode, stad.</li>
        <li>Eén blad per onderwerp, verder met een pijltje.</li>
        <li>Zoals 3, maar het pictogram verschijnt pas via de ?-knop.</li>
        <li>Verplichte velden (*). Alleen die invullen. Pictogram via de ?-knop.</li>
        <li>Geen pictogrammen. De vragen zijn anders verwoord en er zijn extra vragen. Telkens andere sterretjes.</li>
        <li>Zelfstandig: meerdere bladen, sterretjes, wisselende vragen en datumvelden. Elke poging is anders.</li>
      </ol>
      <p>De luidspreker leest een vraag voor (oefening 1 tot 6). Het woord op de verzendknop wisselt: verzenden, versturen, indienen, bevestigen…</p>
      <p><strong>Privacy:</strong> wat de cursist invult, blijft in deze browser en verdwijnt zodra hij de oefening verlaat. Het wordt nooit verstuurd of bewaard.</p>
      ${KLAS_URL ? `<p><strong>Live volgen:</strong> maak een klas en geef de code aan je cursisten. Zij tikken op <em>Klas</em>, typen de code en kiezen een dier. Jij ziet dan per dier welke oefening bezig, fout of klaar is. Meer niet: geen namen, geen ingevulde gegevens. Alles verdwijnt 6 uur na de laatste activiteit. Meerdere lesgevers kunnen elk een eigen klas maken, of samen dezelfde code bekijken.</p>
      <p><button type="button" class="knop" data-actie="lesgever">${IC_KLAS} Klas volgen</button></p>` : ''}
    </details>`;
}

// ---------- Oefening tonen ----------
function startOefening(n) {
  stopPoll();
  state = { n, cfg: maakOefening(n), blad: 0, waarden: {}, uitslag: null };
  meldVooruitgang(n, 'bezig');
  toonBlad();
}

function pictoHtml(sleutel, cfg) {
  if (!sleutel || cfg.picto === 'geen') return '';
  if (cfg.picto === 'zien') return `<img class="picto" src="${P[sleutel]}" alt="">`;
  return `<span class="hulp"><button type="button" class="hulpknop" aria-label="Hulp: toon pictogram">?</button><span class="popup"><img src="${P[sleutel]}" alt=""></span></span>`;
}

function invoerHtml(it, id) {
  const W = state.waarden, val = esc(W[it.key] || '');
  const basis = `autocomplete="off" autocapitalize="off" spellcheck="false"`;
  switch (it.soort) {
    case 'radio':
      return `<div class="keuzes" role="radiogroup" aria-labelledby="${id}-l">${it.opties.map((o, i) =>
        `<label><input type="radio" name="${id}" data-key="${it.key}" value="${o}" ${W[it.key] === o ? 'checked' : ''}> ${o}</label>`).join('')}</div>`;
    case 'vink':
      return `<div class="vink"><label><input type="checkbox" id="${id}" data-key="${it.key}" ${W[it.key] ? 'checked' : ''}> ${esc(it.label)}${it.req ? '<span class="ster">*</span>' : ''}</label></div>`;
    case 'kies':
      return `<select id="${id}" data-key="${it.key}"><option value="">Kies…</option>${it.opties.map(o =>
        `<option ${W[it.key] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    case 'telPrefix':
      return `<div class="telprefix"><span>+32</span><input type="text" id="${id}" data-key="${it.key}" inputmode="tel" ${basis} value="${val}"></div>`;
    case 'datum3':
      return `<div class="datum3">${[['d', 'dag', 2], ['m', 'maand', 2], ['j', 'jaar', 4]].map(([s, t, ml]) =>
        `<div class="${t}"><label for="${id}-${s}">${t}</label><input type="text" id="${id}-${s}" data-key="${it.key}_${s}" inputmode="numeric" maxlength="${ml}" ${basis} value="${esc(W[it.key + '_' + s] || '')}"></div>`).join('')}</div>`;
    case 'datumKies': {
      const nu = new Date().getFullYear();
      const opt = (arr, s) => '<option value=""></option>' + arr.map(x => `<option ${W[it.key + '_' + s] === String(x) ? 'selected' : ''}>${x}</option>`).join('');
      const r = (a, b) => Array.from({ length: Math.abs(b - a) + 1 }, (_, i) => a < b ? a + i : a - i);
      return `<div class="datum3">
        <div><label for="${id}-d">dag</label><select id="${id}-d" data-key="${it.key}_d">${opt(r(1, 31), 'd')}</select></div>
        <div><label for="${id}-m">maand</label><select id="${id}-m" data-key="${it.key}_m">${opt(r(1, 12), 'm')}</select></div>
        <div class="jaar"><label for="${id}-j">jaar</label><select id="${id}-j" data-key="${it.key}_j">${opt(r(nu - 10, 1930), 'j')}</select></div></div>`;
    }
    default:
      return `<input type="text" id="${id}" data-key="${it.key}" ${it.mode ? `inputmode="${it.mode}"` : ''} ${it.ph && state.n !== 8 ? `placeholder="${it.ph}"` : ''} ${basis} value="${val}">`;
  }
}

function veldHtml(it, cfg) {
  const id = 'v-' + it.key;
  const ster = !cfg.alles && it.req ? '<span class="ster" aria-hidden="true">*</span>' : '';
  const sr = !cfg.alles && it.req ? '<span class="hidden"> (verplicht)</span>' : '';
  const r = state.uitslag && state.uitslag[it.key];
  const klasse = r && (r.st === 'fout' || r.st === 'leeg') ? 'fout' : r && r.st === 'teveel' ? 'teveel' : '';
  const melding = r ? `<div class="melding" role="status">${r.st === 'teveel' ? IC.let : IC.nok}<span>${esc(r.tekst)}</span></div>` : '';
  if (it.soort === 'vink') {
    return `<div class="veld ${klasse}" data-veld="${it.key}">${invoerHtml(it, id)}${melding}</div>`;
  }
  const labelFor = ['radio', 'datum3', 'datumKies'].includes(it.soort) ? '' : `for="${id}"`;
  const labelTag = labelFor ? 'label' : 'span';
  const vraag = `<div class="vraag">
      ${cfg.picto === 'zien' ? pictoHtml(it.picto, cfg) : ''}
      <${labelTag} ${labelFor} id="${id}-l" class="vraagtekst">${esc(it.label)}${ster}${sr}</${labelTag}>
      ${cfg.picto === 'hulp' ? pictoHtml(it.picto, cfg) : ''}
      ${cfg.spreek ? spreekKnop(it.label) : ''}
    </div>`;
  if (cfg.layout === 'naast') {
    return `<div class="veld naast ${klasse}" data-veld="${it.key}">${vraag}<div class="invul">${invoerHtml(it, id)}${melding}</div></div>`;
  }
  return `<div class="veld ${it.kort ? 'kort' : ''} ${klasse}" data-veld="${it.key}">${vraag}${invoerHtml(it, id)}${melding}</div>`;
}

function groepHtml(g, cfg) {
  const v = g.velden;
  let rijen;
  if (cfg.picto !== 'geen') rijen = v.map(x => veldHtml(x, cfg)).join(''); // met pictogram: elk veld op een eigen rij
  else if (g.samen) rijen = `${veldHtml(v[0], cfg)}<div class="groepveld pc">${veldHtml(v[1], cfg)}${veldHtml(v[2], cfg)}</div>`;
  else if (g.metBus) rijen = `<div class="groepveld drie">${veldHtml(v[0], cfg)}${veldHtml(v[1], cfg)}${veldHtml(v[2], cfg)}</div><div class="groepveld pc">${veldHtml(v[3], cfg)}${veldHtml(v[4], cfg)}</div>`;
  else rijen = `<div class="groepveld">${veldHtml(v[0], cfg)}${veldHtml(v[1], cfg)}</div><div class="groepveld pc">${veldHtml(v[2], cfg)}${veldHtml(v[3], cfg)}</div>`;
  const icoon = cfg.picto === 'zien' ? `<img class="picto" src="${P[g.picto]}" alt="" style="width:48px;height:48px">` : '';
  return `<fieldset class="groep"><legend>${icoon}${esc(g.titel)}${cfg.spreek ? spreekKnop(g.titel) : ''}</legend>${rijen}</fieldset>`;
}

function toonBlad() {
  const { cfg, n } = state;
  const klaar = klaarLijst();
  const items = cfg.bladen[state.blad];
  const laatste = state.blad === cfg.bladen.length - 1;
  const meer = cfg.bladen.length > 1;

  let kop = '';
  if (cfg.blad === 'pijl') kop = `<div class="bladstippen" aria-label="Blad ${state.blad + 1} van ${cfg.bladen.length}">${cfg.bladen.map((_, i) =>
      `<span class="${i < state.blad ? 'gedaan' : i === state.blad ? 'nu' : ''}"></span>`).join('')}</div>`;
  if (cfg.blad === 'knop') kop = `<p class="stapteller">Stap ${state.blad + 1} van ${cfg.bladen.length}</p>`;

  const sterUitleg = !cfg.alles && state.blad === 0
    ? `<p class="uitleg-ster"><span class="ster">*</span> ${n === 6 ? '= invullen' : '= verplicht'} ${n === 6 ? spreekKnop('Sterretje is invullen. Geen sterretje: niet invullen.') : ''}</p>` : '';

  const velden = items.map(it => it.groep ? groepHtml(it, cfg) : veldHtml(it, cfg)).join('');
  const lichaam = cfg.layout === 'naast' ? `<div class="tabel">${velden}</div>` : velden;

  let knoppen;
  const verzend = `<button type="submit" class="knop">${cfg.knopIcoon ? IC.verzend : ''}${esc(cfg.knop)}</button>`;
  if (cfg.blad === 'pijl') {
    knoppen = `${state.blad > 0 ? `<button type="button" class="pijl terug" data-actie="terug" aria-label="Terug">${IC.links}</button>` : ''}
      ${laatste ? verzend : `<button type="submit" class="pijl" aria-label="Volgende">${IC.rechts}</button>`}`;
  } else if (cfg.blad === 'knop') {
    knoppen = `${state.blad > 0 ? `<button type="button" class="knop wit" data-actie="terug">Vorige</button>` : ''}
      ${laatste ? `<button type="submit" class="knop">${esc(cfg.knop)}</button>` : `<button type="submit" class="knop">${esc(cfg.volgende)}</button>`}`;
  } else knoppen = verzend;

  main.innerHTML = `
    <div class="oefbalk">
      <button type="button" class="rond" data-actie="start" aria-label="Terug naar de oefeningen">${IC.huis}</button>
      <div class="oefnummer"><span class="cijfer">${n}</span></div>
      <div class="stippen" aria-hidden="true">${[1,2,3,4,5,6,7,8].map(i => `<span class="${i === n ? 'nu' : klaar[i] ? 'klaar' : ''}"></span>`).join('')}</div>
    </div>
    <form class="panel" id="form" novalidate autocomplete="off">
      ${kop}${sterUitleg}${lichaam}
      <div class="knoppen">${knoppen}</div>
    </form>`;
  const eerste = main.querySelector('.veld.fout input, .veld.fout select') || (state.blad > 0 || state.uitslag ? main.querySelector('#form input, #form select') : null);
  if (eerste) eerste.focus();
}

// ---------- Verzenden en feedback ----------
function alleVelden() {
  return state.cfg.bladen.flat().flatMap(it => it.groep ? it.velden : [it]);
}

function verstuur() {
  const uitslag = {};
  alleVelden().forEach(it => uitslag[it.key] = beoordeel(it));
  state.uitslag = uitslag;
  const goed = Object.values(uitslag).every(r => r.st === 'ok');
  if (goed) zetKlaar(state.n);
  meldVooruitgang(state.n, goed ? 'klaar' : 'fout');
  toonFeedback(goed);
}

function toonFeedback(goed) {
  const { n } = state;
  const rijen = alleVelden().map(it => {
    const r = state.uitslag[it.key];
    const p = it.picto ? `<img class="picto" src="${P[it.picto]}" alt="">` : '<span class="leegpicto"></span>';
    const icoon = r.st === 'ok' ? IC.ok : r.st === 'teveel' ? IC.let : IC.nok;
    const label = it.soort === 'vink' ? 'Akkoord' : it.label;
    return `<li class="${r.st}">${p}<span><span class="naam">${esc(label)}</span>${r.tekst ? `<span class="uitleg">${esc(r.tekst)}</span>` : ''}</span>${icoon}</li>`;
  }).join('');
  const aantalFout = Object.values(state.uitslag).filter(r => r.st !== 'ok').length;
  main.innerHTML = `
    <div class="oefbalk">
      <button type="button" class="rond" data-actie="start" aria-label="Terug naar de oefeningen">${IC.huis}</button>
      <div class="oefnummer"><span class="cijfer">${n}</span></div>
    </div>
    <div class="panel">
      <div class="uitslag ${goed ? 'goed' : 'niet'}" role="status">
        ${goed ? IC.grootGoed : IC.grootNiet}
        <h2>${goed ? 'Goed zo!' : 'Nog niet goed'} ${spreekKnop(goed ? 'Goed zo! Alles is juist.' : 'Nog niet goed. Kijk naar de rode kruisjes.')}</h2>
        ${goed ? `<div style="margin-top:8px">${IC.duim}</div>` : `<p style="margin:6px 0 0;font-size:1.2rem">${aantalFout} × ${IC.nok.replace('class="st"', 'class="st" style="width:28px;height:28px;vertical-align:middle"')}</p>`}
      </div>
      <ul class="lijst">${rijen}</ul>
      <div class="knoppen">
        ${goed
          ? `${n < 8 ? `<button type="button" class="knop" data-actie="volgende">Oefening ${n + 1} ${IC.rechts}</button>` : ''}
             <button type="button" class="knop wit" data-actie="opnieuw">${IC.opnieuw} Nog eens</button>`
          : `<button type="button" class="knop" data-actie="verbeter">${IC.potlood} Verbeteren</button>
             <button type="button" class="knop wit" data-actie="opnieuw">${IC.opnieuw} Opnieuw</button>`}
      </div>
    </div>`;
  window.scrollTo(0, 0);
  main.querySelector('.knoppen .knop').focus({ preventScroll: true });
}

function verbeter() {
  // naar het eerste blad met een fout
  const idx = state.cfg.bladen.findIndex(b => b.flatMap(it => it.groep ? it.velden : [it]).some(it => state.uitslag[it.key].st !== 'ok'));
  state.blad = Math.max(0, idx);
  toonBlad();
}

// ---------- Gebeurtenissen ----------
main.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.spreek) { spreek(t.dataset.spreek); return; }
  if (t.classList.contains('hulpknop')) {
    const h = t.parentElement;
    h.classList.add('toon');
    clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove('toon'), 3000);
    return;
  }
  if (t.dataset.dier) { kiesDier(t.dataset.dier); return; }
  if (t.dataset.actie && ['klas', 'klasweg', 'lesgever', 'nieuweklas', 'andereklas', 'wisklas'].includes(t.dataset.actie)) { klasActie(t.dataset.actie, t); return; }
  if (t.dataset.oef) { startOefening(+t.dataset.oef); window.scrollTo(0, 0); return; }
  switch (t.dataset.actie) {
    case 'start': toonStart(); window.scrollTo(0, 0); break;
    case 'terug': state.blad--; toonBlad(); break;
    case 'volgende': startOefening(state.n + 1); window.scrollTo(0, 0); break;
    case 'opnieuw': startOefening(state.n); window.scrollTo(0, 0); break;
    case 'verbeter': verbeter(); break;
  }
});
main.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'codeform') { controleerCode(document.getElementById('klascode').value); return; }
  if (e.target.id === 'lesgeverform') { const c = document.getElementById('lgcode').value.toUpperCase().trim(); lesgeverCode = c; zetSS(LK, c); toonLesgever(); return; }
  if (!state) return;
  if (state.blad < state.cfg.bladen.length - 1) { state.blad++; toonBlad(); window.scrollTo(0, 0); }
  else verstuur();
});
function bewaarInGeheugen(e) {
  const el = e.target, key = el.dataset && el.dataset.key;
  if (!key || !state) return;
  state.waarden[key] = el.type === 'checkbox' ? el.checked : el.value;
  // na verbeteren: rode markering weg zodra de cursist iets aanpast
  const v = el.closest('.veld');
  if (v && (v.classList.contains('fout') || v.classList.contains('teveel'))) v.classList.remove('fout', 'teveel');
  if (state.uitslag) delete state.uitslag[key.replace(/_[dmj]$/, '')];
}
main.addEventListener('input', bewaarInGeheugen);
main.addEventListener('change', bewaarInGeheugen);

if ('speechSynthesis' in window) speechSynthesis.getVoices();
window.addEventListener('hashchange', () => { if (location.hash === '#lesgever') toonLesgever(); });
if (location.hash === '#lesgever') toonLesgever(); else toonStart();
</script>
